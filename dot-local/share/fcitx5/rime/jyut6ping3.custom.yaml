patch:
  "speller/algebra/+":
    - derive/^n(?!g)/l/
    - derive/^ng([aeiou])/$1/
    - derive/^([aeiou])/ng$1/
    - derive/^(g|k)wo/$1o/
    - derive/a/aa/
    - derive/aa/a/
    - derive/n$/ng/
    - derive/ng$/n/
    - derive/t$/k/
    - derive/k$/t/
    - derive/m$/ng/
    - derive/p$/k/
  "key_binder/bindings/+":
    - { when: has_menu, accept: Control+h, send: Up }
    - { when: has_menu, accept: Control+l, send: Down }
    - { when: has_menu, accept: Control+k, send: Page_Up }
    - { when: has_menu, accept: Control+j, send: Page_Down }
